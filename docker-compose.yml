services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: wfg
      POSTGRES_PASSWORD: wfg
      POSTGRES_DB: wfg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ELMFIRE + spread worker. Linux/amd64 only (emulated on Apple Silicon).
  worker:
    profiles: ["worker"]
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./cases:/app/cases
    stdin_open: true
    tty: true

volumes:
  pgdata:
