name: deploy

# main에 머지(= main push)되면 API 이미지를 만들어 EC2에 배포한다.
# 마이그레이션 · 바탕 데이터 적재는 하지 않는다 — 사람이 직접 실행(deploy/README.md).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "rules/**"
      - "agent/**"
      - "migrations/**"
      - "alembic.ini"
      - "docker/api/**"
      - "deploy/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  packages: write

# 머지가 연달아 와도 배포는 하나씩(앞의 것을 취소하지 않음).
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wfg-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          platforms: linux/amd64 # EC2 is x86_64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=wfg-api
          cache-to: type=gha,mode=max,scope=wfg-api

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      EC2: ubuntu@${{ secrets.EC2_HOST }}
      SSH: ssh -i ~/.ssh/deploy -o BatchMode=yes
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy compose file
        run: scp -i ~/.ssh/deploy deploy/compose.ec2.yml "$EC2:/home/ubuntu/wfg/compose.yml"
      - name: Pull image and restart
        run: |
          # The job token can read the image only while this job runs; log out right after.
          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH "$EC2" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null"
          $SSH "$EC2" bash -s <<EOF
          set -e
          cd /home/ubuntu/wfg
          echo "API_IMAGE=${IMAGE}:${GITHUB_SHA}" > .env   # compose reads it; pins this version
          docker compose pull api
          docker logout ghcr.io >/dev/null
          docker compose up -d api
          EOF
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if $SSH "$EC2" "curl -fs http://127.0.0.1:8000/health"; then echo; exit 0; fi
            sleep 2
          done
          $SSH "$EC2" "cd /home/ubuntu/wfg && docker compose logs --tail 50 api"
          exit 1
