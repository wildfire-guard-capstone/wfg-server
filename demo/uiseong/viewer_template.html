<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>의성 산불 대응 제안 데모</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;
--now:#b91c1c;--wait:#b45309;--talk:#1d4ed8;--ask:#6d28d9;--ok:#047857;--fail:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{background:#111827;color:#fff;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:700}
header .sub{color:#9ca3af;font-size:12px}
.rounds{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.rounds button{background:#1f2937;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px;text-align:left}
.rounds button b{display:block;font-size:14px;color:#fff}
.rounds button.on{background:var(--accent);border-color:var(--accent)}
main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;padding:12px;height:calc(100vh - 64px)}
.col{display:flex;flex-direction:column;gap:12px;min-height:0}
#map{flex:1;min-height:340px;border-radius:10px;border:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.tabs button{border:1px solid var(--line);background:#f9fafb;border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit;font-size:13px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#right{overflow:auto}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kv{background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.kv span{display:block;font-size:11px;color:var(--sub)}
.kv b{font-size:14px}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-child{border-top:0}
.ih{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.ih .id{font-weight:700;color:var(--accent);min-width:26px}
.ih .nm{font-weight:700;flex:1}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;border:1px solid}
.b-ok{color:var(--ok);border-color:#a7f3d0;background:#ecfdf5}
.b-reused{color:#374151;border-color:#d1d5db;background:#f3f4f6}
.b-failed{color:var(--fail);border-color:#fecaca;background:#fef2f2}
.b-no_llm,.b-not_run{color:#6b7280;border-color:#e5e7eb;background:#fff}
.finding{font-size:12.5px;color:#374151;background:#f3f4f6;border-radius:6px;padding:6px 8px;margin:6px 0}
.finding:before{content:"판정 ";font-weight:700;color:var(--sub)}
.sec h4{margin:8px 0 4px;font-size:13px}
.para{margin:4px 0}
.cat{font-weight:700;margin-right:4px}
.c-즉시{color:var(--now)}.c-대기{color:var(--wait)}.c-협의{color:var(--talk)}.c-요청{color:var(--ask)}
.cite{color:var(--sub);font-size:12px}
.src{font-size:10.5px;color:#6b7280;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:2px}
.lbl{font-weight:700}
ul.rows,ol.rows{margin:4px 0 6px;padding-left:18px}
ul.rows li,ol.rows li{margin:2px 0}
ol.rows{list-style:none;padding-left:4px}
.note{font-size:12.5px;color:var(--sub)}
.failed{color:var(--fail);font-weight:700}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{background:#f9fafb}
.withheld{font-size:12px;color:var(--sub);margin-top:4px}
.ev{margin-top:6px;font-size:12.5px}.ev summary{cursor:pointer;color:var(--sub)}
.evc{border-left:3px solid #cbd5e1;padding:2px 8px;margin:6px 0}
.evc pre{white-space:pre-wrap;font:12px/1.5 inherit;margin:4px 0 0;max-height:220px;overflow:auto}
.b-partial{color:#92400e;border-color:#fde68a;background:#fffbeb}
.para.has-ev{border-left:3px solid transparent;padding:2px 0 2px 8px;margin-left:-11px;border-radius:2px;cursor:help}
.para.has-ev.k-즉시{border-left-color:var(--now)}.para.has-ev.k-대기{border-left-color:var(--wait)}.para.has-ev.k-협의{border-left-color:var(--talk)}.para.has-ev.k-요청{border-left-color:var(--ask)}
.para.has-ev:hover,.para.has-ev.pin{background:#f1f5f9}
.evdot{display:inline-block;font-size:10px;color:#94a3b8;margin-left:4px;vertical-align:1px}
#tip{position:fixed;z-index:1000;display:none;max-width:min(560px,92vw);max-height:56vh;overflow:auto;background:#fff;border:1px solid #cbd5e1;border-radius:8px;box-shadow:0 8px 24px rgba(15,23,42,.18);padding:10px 12px;font-size:12.5px;line-height:1.55}
#tip .th{display:flex;gap:6px;align-items:baseline;margin-bottom:6px}
#tip .cite{font-size:12.5px;color:var(--ink);font-weight:700}
#tip .qt{background:#f8fafc;border-left:3px solid #94a3b8;padding:4px 8px;margin:4px 0 8px}
#tip .qt.no{border-left-color:#fca5a5}
#tip .evc pre{max-height:none}
#tip mark{background:#fef08a;padding:0 1px}
#tip .sit{background:#f0f9ff;border-left:3px solid #38bdf8;padding:4px 8px;margin:4px 0 8px}
.collapsed .body{display:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);align-items:center}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.bar{height:10px;background:#f97316;border-radius:3px}
.err{color:var(--fail);font-size:12px}
.small{font-size:12px;color:var(--sub)}
@media (max-width:900px){main{grid-template-columns:1fr;height:auto}#map{height:60vh}}
</style>
</head>
<body>
<header>
  <div><h1>의성 산불 대응 제안 데모</h1><div class="sub">2025-03-22 안평면 괴산리 · ELMFIRE 예측 → 규칙 엔진 → __MODEL__ · 실제 구동 결과</div></div>
  <div class="rounds" id="rounds"></div>
</header>
<main>
  <section class="col">
    <div id="map"></div>
    <div class="card">
      <div class="legend" id="legend"></div>
      <label class="small"><input type="checkbox" id="showLater" checked> 뒤 상황도 화선(검증용, 점선)</label>
    </div>
  </section>
  <section class="col" id="right">
    <div class="card">
      <div class="tabs" id="tabs"></div>
      <div id="pane"></div>
    </div>
  </section>
</main>
<script>
const D = /*__DATA__*/null;
const PCOL = ["#7f1d1d","#c2410c","#ea580c","#f97316","#fb923c","#fdba74","#fcd34d","#fde68a","#fef3c7"];
const ZCOL = {burning:"#b91c1c", p5:"#ea580c", p8:"#ca8a04"};
const ZNAME = {burning:"이미 닿음", p5:"위험구역(5시간)", p8:"잠재 위험구역(8시간)"};
const STATE = {ok:"생성", partial:"일부 생성(검사 실패 제안 뺌)", reused:"직전 재사용", failed:"제안 없음", not_run:"LLM 미실행"};
let cur = 0, tab = "proposal", collapsedAll = false;
const map = L.map("map", {preferCanvas:true});
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:17, attribution:"© OpenStreetMap contributors"}).addTo(map);
let layer = L.layerGroup().addTo(map), laterLayer = L.layerGroup().addTo(map);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\[([^\[\]]+)\]/g, '<span class="cite">[$1]</span>');
const vgeom = Object.fromEntries(D.village_geoms.map(v => [v.id, v.geom]));
const mins = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };

function drawMap(r) {
  layer.clearLayers(); laterLayer.clearLayers();
  const rs = r.spread.ranges;
  for (let p = 8; p >= 1; p--) L.geoJSON(rs[p], {style:{color:PCOL[p], weight:0.6, fillColor:PCOL[p], fillOpacity:0.32}})
      .bindTooltip(`P${p} · ~${r.round.slices_until[p]} · ${r.spread.areas_ha[p]} ha`, {sticky:true}).addTo(layer);
  L.geoJSON(rs[0], {style:{color:"#111827", weight:1.5, fillColor:"#7f1d1d", fillOpacity:0.75}})
    .bindTooltip(`P0 관측 화선(${r.round.report} ${r.round.at}) · ${r.spread.areas_ha[0]} ha`, {sticky:true}).addTo(layer);
  for (const v of r.villages) if (vgeom[v.id]) L.geoJSON(vgeom[v.id], {style:{color:ZCOL[v.zone], weight:2, fill:false, dashArray: v.zone==="p8"?"4 3":null}})
      .bindTooltip(`<b>${esc(v.name)}</b>(${esc(v.emd)}) · ${ZNAME[v.zone]}${v.zone==="burning"?"":` · ${v.from}~${v.until}`} · ${v.people}명`, {sticky:true}).addTo(layer);
  for (const f of r.vulnerable) { const c = D.vul_pts[f.id]; if (!c) continue;
    L.circleMarker([c[1], c[0]], {radius:6, color:"#fff", weight:2, fillColor:"#7c3aed", fillOpacity:1})
      .bindTooltip(`${esc(f.name)} (${esc(f.kind)}) · ${esc(f.village)} · ${f.until}`).addTo(layer); }
  L.circleMarker(D.ignition, {radius:5, color:"#111", fillColor:"#facc15", fillOpacity:1, weight:1.5}).bindTooltip("발화점 11:24").addTo(layer);
  const t0 = mins(r.round.at);
  for (const p of D.perimeters) { const dt = (mins(p.at) - t0) / 60; if (dt <= 0 || dt > 8) continue;
    L.geoJSON(p.geom, {style:{color:"#111827", weight:1.6, dashArray:"6 4", fill:false}})
      .bindTooltip(`상황도 ${p.no}보 ${p.at} (검증용, 예측에 쓰지 않음)`, {sticky:true}).addTo(laterLayer); }
  if (!document.getElementById("showLater").checked) map.removeLayer(laterLayer);
  map.fitBounds(L.geoJSON(rs[8]).getBounds().pad(0.15));
}
document.getElementById("showLater").onchange = e => e.target.checked ? laterLayer.addTo(map) : map.removeLayer(laterLayer);
document.getElementById("legend").innerHTML =
  [0,1,3,5,8].map(p => `<span><span class="sw" style="background:${PCOL[p]}"></span>${p?`P${p}`:"P0 관측 화선"}</span>`).join("") +
  Object.entries(ZCOL).map(([z,c]) => `<span><span class="sw" style="border:2px solid ${c}"></span>${ZNAME[z]}</span>`).join("") +
  `<span><span class="sw" style="background:#7c3aed;border-radius:50%"></span>취약시설</span>`;

// 제안 문단: 화면에는 제안 문장만, 근거(표기 · 근거 문장 · 원문 발췌)는 마우스를 올리면(누르면 고정) 보인다
let TIPS = [];
const CITE_RE = /\s*\[[^\[\]]*\]/g;
const bodyOf = b => b.body || String(b.text || "").replace(CITE_RE, "");
const citeOf = b => b.cite || ((String(b.text || "").match(/\[[^\[\]]*\]/g) || []).join(" "));
const norm = s => String(s || "").replace(/[^가-힣A-Za-z0-9]/g, "");
function excerpt(text, quote) {
  // 근거 원문에서 근거 문장 자리를 찾아 그 둘레만 보이고 표시한다(띄어쓰기 · 문장부호 무시로 찾음)
  text = String(text || ""); const q = norm(quote);
  if (q.length >= 6) {
    const map = []; let n = "";
    for (let i = 0; i < text.length; i++) if (/[가-힣A-Za-z0-9]/.test(text[i])) { map.push(i); n += text[i]; }
    for (const len of [q.length, 24, 12]) { const key = q.slice(0, Math.min(len, q.length)); const at = n.indexOf(key); if (at < 0) continue;
      const endN = Math.min(n.length - 1, at + q.length - 1), s = map[at], e = map[endN] + 1;
      const a = Math.max(0, s - 160), z = Math.min(text.length, e + 160);
      return (a ? "… " : "") + esc(text.slice(a, s)) + "<mark>" + esc(text.slice(s, e)) + "</mark>" + esc(text.slice(e, z)) + (z < text.length ? " …" : ""); }
  }
  return esc(text.slice(0, 420)) + (text.length > 420 ? " …" : "");
}
function block(b, it) {
  if (b.type === "paragraph") {
    const ev = (b.evidence || []).map(id => (it.evidence || []).find(e => e.chunk_id === id)).filter(Boolean);
    const i = TIPS.push({b, ev}) - 1;
    return `<p class="para has-ev k-${esc(b.category)}" data-tip="${i}">${md(bodyOf(b))}<span class="evdot" aria-hidden="true">근거</span></p>`;
  }
  if (b.type === "failed") return `<p class="para failed">${esc(b.text)}</p>`;
  if (b.type === "list") { const tag = b.style === "numbered" ? "ol" : "ul"; return `<${tag} class="rows">${b.rows.map(r => `<li>${md(r.text)}</li>`).join("")}</${tag}>`; }
  if (b.type === "table") { const keys = ["group","agency","ask","item","basis"];
    return `<table><tr>${b.head.map(h => `<th>${esc(h)}</th>`).join("")}</tr>${b.rows.map(r => `<tr>${keys.map(k => `<td>${md(r[k])}</td>`).join("")}</tr>`).join("")}</table>`; }
  if (b.type === "note") return `<p class="note">${md(b.text)}</p>`;
  return "";
}
function proposal(r) {
  TIPS = [];
  const s = r.stage, c = r.commander, a = r.spread.areas_ha;
  let h = `<div class="summary">
    <div class="kv"><span>제안서</span><b>${esc(r.round.version)} · ${esc(r.round.at)}</b></div>
    <div class="kv"><span>읽는 사람</span><b>${esc(r.round.reader)}</b></div>
    <div class="kv"><span>현재 단계(판정)</span><b>${esc(r.common.current_stage)}</b></div>
    <div class="kv"><span>5시간 뒤 단계</span><b>${esc(s.p5.stage)}</b></div>
    <div class="kv"><span>지휘권자</span><b>${esc(c.now.title)} → ${esc(c.next.title)}</b></div>
    <div class="kv"><span>면적 P0 / P5 / P8</span><b>${a[0]} / ${a[5]} / ${a[8]} ha</b></div></div>
    <p class="small">기준 화선: ${esc(r.round.report)} ${esc(r.round.at)} (${esc(r.round.note)}) · <a href="#" id="tog">${collapsedAll?"모두 펼치기":"모두 접기"}</a> · 제안 문단에 마우스를 올리면(누르면 고정) 근거가 보입니다</p>`;
  for (const it of r.proposal) {
    const wh = (it.withheld||[]).map(w => `${esc(w.field)}(${esc(w.reason)})`).join(" · ");
    h += `<div class="item ${collapsedAll?"collapsed":""}"><div class="ih"><span class="id">${esc(it.id)}</span><span class="nm">${esc(it.name)}</span>
      <span class="badge b-${it.state}">${STATE[it.state]||it.state}</span></div><div class="body">
      <div class="finding">${esc(it.finding)}</div>
      ${it.sections.map(sec => `<div class="sec">${sec.title?`<h4>${esc(sec.title)}</h4>`:""}${sec.blocks.map(b => block(b, it)).join("")}</div>`).join("")}
      ${wh?`<div class="withheld">빠진 정보: ${wh}</div>`:""}</div></div>`;
  }
  return h;
}
function spreadTab(r) {
  const cal = r.calibration, a = r.spread.areas_ha, mx = Math.max(...a);
  const parts = cal.parts || [cal];
  let h = `<h4>확산속도 보정(그 시각까지 알 수 있는 정보만)</h4><p>${esc(cal.from)} → <b>배율 ${cal.adj.toFixed(2)}</b></p>` +
    parts.map(p => `<p>· ${esc(p.from)}: 목표 ${p.target_ha} ha, 결과 ${p.got_ha} ha · 배율 ${p.adj.toFixed(2)}${p.clipped?` (탐색 범위 끝: ${p.clipped})`:""}<br><span class="small">시도: ${p.tries.map(t => `${t[0]}→${t[1]} ha`).join(" · ")}</span></p>`).join("") + `
    <h4>예측 범위(${esc(r.round.at)} 기준, ELMFIRE ${r.spread.wall_s}초)</h4><table><tr><th>범위</th><th>~까지</th><th>면적(ha)</th><th></th></tr>`;
  a.forEach((v,i) => h += `<tr><td>${i?`P${i}`:"P0 관측"}</td><td>${esc(r.round.slices_until[i])}</td><td>${v}</td><td style="width:45%"><div class="bar" style="width:${(v/mx*100).toFixed(1)}%;background:${PCOL[i]}"></div></td></tr>`);
  h += `</table><h4>검증: 뒤 상황도 화선과 비교</h4>`;
  if (!r.spread.validation.length) h += `<p class="small">8시간 안에 비교할 상황도가 없습니다.</p>`;
  else h += `<table><tr><th>상황도</th><th>경과</th><th>예측(ha)</th><th>상황도(ha)</th><th>IoU</th></tr>${r.spread.validation.map(v => `<tr><td>${v.at}</td><td>${Math.floor(v.hours)?`${Math.floor(v.hours)}시간 `:""}${Math.round((v.hours%1)*60)?`${Math.round((v.hours%1)*60)}분`:""}</td><td>${v.pred_ha}</td><td>${v.obs_ha}</td><td>${v.iou}</td></tr>`).join("")}</table>
    <p class="small">상황도 면적 = 기준 화선 ∪ 그 시각 화선. 진화 효과가 없는 예측이라 실제보다 넓을 수 있습니다.</p>`;
  const w = r.weather;
  h += `<h4>바람(${esc(w.wind_source || "0시 = 상황 보고, 1~8시간 = ELMFIRE 입력 기상")})</h4><table><tr><th>시간</th>${Object.keys(w.wind_ms).map(k => `<th>${k}</th>`).join("")}</tr>
    <tr><td>m/s</td>${Object.values(w.wind_ms).map(v => `<td>${v}</td>`).join("")}</tr><tr><td>풍향°</td>${Object.values(w.wind_deg).map(v => `<td>${v}</td>`).join("")}</tr></table>`;
  return h;
}
function logTab(r) {
  const t = r.timing, calls = r.calls;
  const tok = calls.reduce((s,c) => s + (c.completion_tokens||0), 0);
  let h = `<p>회차 전체 ${t.round_s}초 · 규칙 엔진 ${t.rules_s}초 · 에이전트 ${t.llm_s}초 · LLM 호출 ${calls.length}회 · 생성 토큰 ${tok}</p>
    <table><tr><th>항목</th><th>상태</th><th>시도</th><th>검색 질의</th><th>근거(판정 근거 · 검색)</th><th>검사 문제 · 뺀 제안</th></tr>`;
  for (const lg of r.logs) { const it = r.proposal.find(p => p.id === lg.id) || {};
    const errs = lg.attempts.map((a,i) => { const e = Object.entries(a.errors||{}).map(([k,v]) => `제안 ${isNaN(+k)?k:+k+1}: ${v.join(" / ")}`); return e.length?`${i+1}차 — ${e.join(" · ")}`:""; }).filter(Boolean);
    const drop = (lg.dropped||[]).map(d => `뺌: ${d.text}`);
    h += `<tr><td>${esc(lg.id)}</td><td>${STATE[it.state]||""}${lg.reused_from?` (${esc(lg.reused_from)})`:""}</td><td>${lg.attempts.length}</td>
      <td class="small">${esc((lg.queries||[]).join(" / "))}</td>
      <td class="small">${esc((lg.evidence||[]).map(e => `${e[0]}(${e[1]}${e[2]==="판정 근거"?", 판정":""})`).join(", "))}</td>
      <td class="err">${errs.concat(drop).map(esc).join("<br>")}</td></tr>`; }
  h += `</table><h4>LLM 호출</h4><table><tr><th>호출</th><th>추론</th><th>초</th><th>입력 토큰</th><th>생성 토큰</th><th>끝</th></tr>
    ${calls.map(c => `<tr><td>${esc(c.tag)}</td><td>${c.thinking?"켬":""}</td><td>${c.seconds}</td><td>${c.prompt_tokens}</td><td>${c.completion_tokens}</td><td>${esc(c.finish)}</td></tr>`).join("")}</table>`;
  return h;
}
const CATNAME = {즉시:"즉시 · 지금 할 일", 대기:"대기 · 조건이 되면", 협의:"협의 · 발령권자와", 요청:"요청 · 다른 기관에"};
const tip = document.createElement("div"); tip.id = "tip"; document.body.appendChild(tip);
let pinned = null, hideTimer = null;
function tipHtml(t) {
  const b = t.b, cite = citeOf(b);
  let h = `<div class="th"><span class="cat c-${esc(b.category)}">${esc(CATNAME[b.category] || b.category || "")}</span>${cite ? `<span class="cite">${esc(cite)}</span>` : ""}</div>`;
  if (b.situation) h += `<div class="sit"><span class="small">판정 값 문장(규칙 엔진 판정으로 코드가 씀)</span><br>${esc(b.situation)}<br><span class="small">할 일 문장(LLM이 아래 근거로 씀)</span><br>${esc(b.action_text || "")}</div>`;
  if (b.quote) h += `<div class="qt ${b.quote_ok === false ? "no" : ""}"><span class="small">근거 문장${b.quote_ok === false ? " (원문과 70% 미만 일치 — 확인 필요)" : ""}</span><br>「${esc(b.quote)}」</div>`;
  h += t.ev.map(e => `<div class="evc"><b>${esc(e.label)}</b> <span class="small">${esc(e.doc_name)} ${esc(e.section || "")} · ${esc(e.origin)}</span><pre>${excerpt(e.text, b.quote)}</pre></div>`).join("");
  if (!t.ev.length) h += `<p class="small">근거 원문 없음</p>`;
  return h;
}
function showTip(el) {
  clearTimeout(hideTimer);
  const t = TIPS[+el.dataset.tip]; if (!t) return;
  tip.innerHTML = tipHtml(t); tip.style.display = "block";
  const r = el.getBoundingClientRect(), w = tip.offsetWidth, hgt = tip.offsetHeight;
  const left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  const below = r.bottom + 6 + hgt < window.innerHeight;
  tip.style.left = left + "px"; tip.style.top = (below ? r.bottom + 6 : Math.max(8, r.top - hgt - 6)) + "px";
}
function hideTip(now) { if (pinned) return; clearTimeout(hideTimer); hideTimer = setTimeout(() => tip.style.display = "none", now ? 0 : 180); }
tip.onmouseenter = () => clearTimeout(hideTimer);
tip.onmouseleave = () => hideTip();
document.addEventListener("click", e => { if (!tip.contains(e.target) && !e.target.closest(".para.has-ev") && pinned) { pinned.classList.remove("pin"); pinned = null; hideTip(true); } });
function bindTips(pane) {
  pane.querySelectorAll(".para.has-ev").forEach(el => {
    el.onmouseenter = () => { if (!pinned) showTip(el); };
    el.onmouseleave = () => hideTip();
    el.onclick = () => { if (pinned) pinned.classList.remove("pin"); if (pinned === el) { pinned = null; hideTip(true); return; } pinned = el; el.classList.add("pin"); showTip(el); };
  });
  document.getElementById("right").onscroll = () => { if (pinned) { pinned.classList.remove("pin"); pinned = null; } hideTip(true); };
}
function render() {
  const r = D.rounds[cur];
  pinned = null; tip.style.display = "none";
  document.getElementById("rounds").innerHTML = D.rounds.map((x,i) =>
    `<button class="${i===cur?"on":""}" data-i="${i}"><b>${x.round.at} ${x.round.version}</b>${x.round.report} · ${x.round.reader}</button>`).join("");
  document.querySelectorAll("#rounds button").forEach(b => b.onclick = () => { cur = +b.dataset.i; render(); });
  const T = {proposal:"제안서", spread:"예측 · 검증", log:"실행 기록"};
  document.getElementById("tabs").innerHTML = Object.entries(T).map(([k,v]) => `<button class="${k===tab?"on":""}" data-t="${k}">${v}</button>`).join("");
  document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  const pane = document.getElementById("pane");
  pane.innerHTML = tab === "proposal" ? proposal(r) : tab === "spread" ? spreadTab(r) : logTab(r);
  pane.querySelectorAll(".ih").forEach(x => x.onclick = () => x.parentElement.classList.toggle("collapsed"));
  bindTips(pane);
  const tog = document.getElementById("tog"); if (tog) tog.onclick = e => { e.preventDefault(); collapsedAll = !collapsedAll; render(); };
  drawMap(r);
}
render();
</script>
