[project]
name = "wfg-server"
version = "0.1.0"
description = "Backend server for Wildfire Guard — API, spread prediction (ELMFIRE) and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # rules/ geometry (also used by spread/). The worker installs with --no-deps and
    # gets shapely from its conda env.
    "shapely>=2.0",
    # risk/ grading (RISK-01 in the API, demo step 1b). Raster files need rasterio, which is
    # imported only when a region grid is configured (RISK_GRID_DIR).
    "numpy>=1.26",
    # app/ coordinate transforms (EPSG:5179 <-> 4326): file predictor, engine inputs, API.
    "pyproj>=3.6",
    # ELMFIRE weather input (app/weather/elmfire_input · deck): the API reads the deck weather
    # grid when PREDICTOR=elmfire. The worker gets it from its conda env (--no-deps).
    "rasterio>=1.4",
    # API auth: JWT access tokens, password hashing.
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
]

[project.optional-dependencies]
# Numerical stack for spread/evaluation. In the worker image these come from the
# ELMFIRE conda-forge env (GDAL must stay < 3.11 there), so do not add GDAL here.
spread = [
    "numpy>=1.26",
    "pyproj>=3.6",
]
# 의성 데모(demo/uiseong): 데이터 준비(SGIS shapefile)만 로컬에서 쓴다
demo = [
    "pyshp>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "spread", "evaluation", "rules", "risk", "agent", "assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the ELMFIRE worker image (run in CI L2, not L1)",
]
addopts = "-m 'not integration'"
