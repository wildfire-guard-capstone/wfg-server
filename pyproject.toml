[project]
name = "wfg-server"
version = "0.1.0"
description = "Backend server for Wildfire Guard — API, spread prediction (ELMFIRE) and evaluation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Numerical stack for spread/evaluation. In the worker image these come from the
# ELMFIRE conda-forge env (GDAL must stay < 3.11 there), so do not add GDAL here.
spread = [
    "numpy>=1.26",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "spread", "evaluation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the ELMFIRE worker image (run in CI L2, not L1)",
]
addopts = "-m 'not integration'"
