name: elmfire-image

# Build the upstream ELMFIRE base image (pinned commit) and our worker image,
# natively on linux/amd64, and push both to GHCR so nobody has to build ELMFIRE
# under emulation on a Mac.
# Called by deploy.yml on every deploy (so the worker on EC2 runs the same commit as the API);
# run it by hand (workflow_dispatch) to rebuild without deploying.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "elmfire=$(cat docker/worker/ELMFIRE_REF)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: ELMFIRE base (upstream, pinned)
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/lautenberger/elmfire.git#${{ steps.ref.outputs.elmfire }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/elmfire-base:${{ steps.ref.outputs.elmfire }}
            ${{ env.REGISTRY }}/elmfire-base:latest
          cache-from: type=gha,scope=elmfire-base
          cache-to: type=gha,mode=max,scope=elmfire-base
      - name: Worker (ELMFIRE + spread)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker/Dockerfile
          build-args: ELMFIRE_BASE=${{ env.REGISTRY }}/elmfire-base:${{ steps.ref.outputs.elmfire }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/wfg-worker:${{ github.sha }}
            ${{ env.REGISTRY }}/wfg-worker:latest
